[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "file-manager-mcp"
version = "0.1.0"
description = "MCP server giving AI assistants sandboxed file access: list, read, write, search — confined to a configured root."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["mcp", "filesystem", "file-manager", "ai", "claude", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
]
dependencies = ["mcp>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
file-manager-mcp = "file_manager_mcp.server:main"

[project.urls]
Homepage = "https://github.com/asd369932/file-manager-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/file_manager_mcp"]
